<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  .hs-frame[data-open="false"] .hs-drawer { transform:translateX(-104%) !important; }
  .hs-frame[data-open="false"] .hs-scrim { opacity:0 !important; pointer-events:none; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:#050203;padding:40px 32px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">

  <div class="hs-frame" data-open="{{ open }}" style="position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:44px;background:radial-gradient(120% 76% at 50% 18%, #2A1216 0%, #150A0C 46%, #0A0405 100%);box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

          <svg width="17" height="18" viewBox="0 0 17 18" fill="none">
            <circle cx="8.5" cy="5.4" r="3.6" stroke="rgba(244,237,228,.85)" stroke-width="1.4"></circle>
            <path d="M1.8 16.5c0-3.1 3-5.2 6.7-5.2s6.7 2.1 6.7 5.2" stroke="rgba(244,237,228,.85)" stroke-width="1.4" stroke-linecap="round"></path>
          </svg>
        </button>
        <x-import component-from-global-scope="hisaab-mark" from="../assets/hisaab-mark.js" width="124" hint-size="124px,40px" style="display:block;opacity:0.92"></x-import>
      </div>

        <div style="position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:19px;border:1px solid rgba(184,150,60,.55);background:rgba(184,150,60,.18)"></div>
        <span style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;font:500 15px 'Hind',sans-serif;color:#F6E9CB">Groups</span>
        <span style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;font:500 15px 'Hind',sans-serif;color:rgba(255,255,255,.45)">People</span>
      </div>

      <div style="margin-top:18px;display:flex;flex-direction:column;gap:11px">
        <x-import component-from-global-scope="hisaab-row" from="../assets/hisaab-row.js" name="Goa, finally" meta="6 members" amount="12480" direction="owe" hint-size="100%,76px" style="display:block"></x-import>
        <x-import component-from-global-scope="hisaab-row" from="../assets/hisaab-row.js" name="Flat 302" meta="3 members" amount="840" direction="owe" hint-size="100%,76px" style="display:block"></x-import>
        <x-import component-from-global-scope="hisaab-row" from="../assets/hisaab-row.js" name="Sunday football" meta="11 members" amount="0" hint-size="100%,76px" style="display:block"></x-import>
        <x-import component-from-global-scope="hisaab-row" from="../assets/hisaab-row.js" name="Wedding season" meta="8 members" amount="3150" direction="owed" hint-size="100%,76px" style="display:block"></x-import>

    <div class="hs-scrim" onClick="{{ onClose }}" style="position:absolute;inset:0;z-index:2;background:rgba(6,3,4,.62);backdrop-filter:blur(2px);opacity:1;transition:opacity .34s ease;cursor:pointer"></div>

    <div class="hs-drawer" onPointerDown="{{ onSwipeStart }}" onPointerUp="{{ onSwipeEnd }}" style="position:absolute;top:0;bottom:0;left:0;z-index:3;touch-action:pan-y;width:80%;box-sizing:border-box;padding:66px 20px 22px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.14);border-radius:0 34px 34px 0;background:rgba(28,14,17,0.62);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:24px 0 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16);transform:translateX(0);transition:transform .38s cubic-bezier(.32,.72,.24,1)">

      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent);pointer-events:none"></div>

      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex:none;display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:31px;border:1px solid rgba(184,150,60,.45);background:rgba(122,40,51,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font:500 21px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.5px">AM</div>

          <span style="font-family:'Rozha One',serif;font-size:25px;line-height:1.1;color:#F4EDE4;letter-spacing:.3px">Aanya Mehra</span>
          <button type="button" onClick="{{ onEdit }}" style="align-self:flex-start;padding:0;border:none;background:none;cursor:pointer;font:400 13px 'Hind',sans-serif;color:#D9B65A;border-bottom:1px solid rgba(184,150,60,.45);transition:color .18s ease" style-hover="color:#E4C878">Edit profile</button>
        </div>
      </div>

      <div style="margin:22px 0 6px;height:1px;background:rgba(255,255,255,.1)"></div>

      <div style="display:flex;flex-direction:column">
        <button type="button" onClick="{{ onTip }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;margin-bottom:6px;box-sizing:border-box;text-align:left;border:1px solid rgba(184,150,60,.4);border-radius:18px;background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);cursor:pointer;transition:background .18s ease, border-color .18s ease" style-hover="background:rgba(184,150,60,.2);border-color:rgba(184,150,60,.7)" style-active="background:rgba(184,150,60,.28)">
          <svg width="19" height="18" viewBox="0 0 19 18" fill="none"><path d="M9.5 16S1.8 11.6 1.8 6.6A4.3 4.3 0 0 1 9.5 4a4.3 4.3 0 0 1 7.7 2.6C17.2 11.6 9.5 16 9.5 16Z" stroke="#D9B65A" stroke-width="1.5" stroke-linejoin="round"></path></svg>
          <span style="flex:1;font:500 15.5px 'Hind',sans-serif;color:#F6E9CB;letter-spacing:.1px">Tip jar</span>
          <span style="font:400 11px 'Hind',sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:rgba(184,150,60,.85)">Support us!</span>
        </button>

        <button type="button" onClick="{{ onRow }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;box-sizing:border-box;text-align:left;border:none;border-radius:18px;background:none;cursor:pointer;transition:background .18s ease" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="rgba(244,237,228,.7)" stroke-width="1.4"></circle><path d="M10 1.8v2.4M10 15.8v2.4M2.6 10H5m10 0h2.4M4.7 4.7l1.7 1.7m7.2 7.2 1.7 1.7M15.3 4.7l-1.7 1.7m-7.2 7.2-1.7 1.7" stroke="rgba(244,237,228,.7)" stroke-width="1.4" stroke-linecap="round"></path></svg>
          <span style="flex:1;font:400 15.5px 'Hind',sans-serif;color:rgba(244,237,228,.9);letter-spacing:.1px">Settings</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1.5 1l4 5-4 5" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

        <button type="button" onClick="{{ onRow }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;box-sizing:border-box;text-align:left;border:none;border-radius:18px;background:none;cursor:pointer;transition:background .18s ease" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)">
          <svg width="20" height="18" viewBox="0 0 20 18" fill="none"><circle cx="7.4" cy="5.6" r="3.4" stroke="rgba(244,237,228,.7)" stroke-width="1.4"></circle><path d="M1.6 16.2c0-2.9 2.6-4.8 5.8-4.8s5.8 1.9 5.8 4.8" stroke="rgba(244,237,228,.7)" stroke-width="1.4" stroke-linecap="round"></path><path d="M16.4 4.6v5M13.9 7.1h5" stroke="#D9B65A" stroke-width="1.4" stroke-linecap="round"></path></svg>
          <span style="flex:1;font:400 15.5px 'Hind',sans-serif;color:rgba(244,237,228,.9);letter-spacing:.1px">Invite friends</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1.5 1l4 5-4 5" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

        <button type="button" onClick="{{ onRow }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;box-sizing:border-box;text-align:left;border:none;border-radius:18px;background:none;cursor:pointer;transition:background .18s ease" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="rgba(244,237,228,.7)" stroke-width="1.4"></circle><path d="M7.7 7.6a2.4 2.4 0 0 1 4.6.9c0 1.6-2.3 1.9-2.3 3.3" stroke="rgba(244,237,228,.7)" stroke-width="1.4" stroke-linecap="round"></path><circle cx="10" cy="14.6" r="0.9" fill="rgba(244,237,228,.7)"></circle></svg>
          <span style="flex:1;font:400 15.5px 'Hind',sans-serif;color:rgba(244,237,228,.9);letter-spacing:.1px">Help and feedback</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1.5 1l4 5-4 5" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

        <button type="button" onClick="{{ onRow }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;box-sizing:border-box;text-align:left;border:none;border-radius:18px;background:none;cursor:pointer;transition:background .18s ease" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><rect x="2.4" y="2.4" width="15.2" height="15.2" rx="4" stroke="rgba(244,237,228,.7)" stroke-width="1.4"></rect><path d="M10 8.8v5.2" stroke="rgba(244,237,228,.7)" stroke-width="1.4" stroke-linecap="round"></path><circle cx="10" cy="6.3" r="0.9" fill="rgba(244,237,228,.7)"></circle></svg>
          <span style="flex:1;font:400 15.5px 'Hind',sans-serif;color:rgba(244,237,228,.9);letter-spacing:.1px">About Hisaab</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1.5 1l4 5-4 5" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </div>

      <div style="flex:1"></div>

      <div style="margin:0 0 6px;height:1px;background:rgba(255,255,255,.1)"></div>

      <button type="button" onClick="{{ onSignOut }}" style="display:flex;align-items:center;gap:14px;padding:13px 14px;box-sizing:border-box;text-align:left;border:none;border-radius:18px;background:none;cursor:pointer;transition:background .18s ease, color .18s ease" style-hover="background:rgba(255,255,255,.05)" style-active="background:rgba(255,255,255,.08)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7.2 15.6H3.6A1.6 1.6 0 0 1 2 14V4a1.6 1.6 0 0 1 1.6-1.6h3.6M11.6 12.2 15 9l-3.4-3.2M15 9H7.4" stroke="rgba(255,255,255,.42)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font:400 14.5px 'Hind',sans-serif;color:rgba(255,255,255,.42);letter-spacing:.1px">Sign out</span>
      </button>

      <span style="margin-top:8px;padding-left:14px;font:300 10.5px 'Hind',sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.2)">Hisaab v1.0.3</span>
    </div>

    <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:4;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:24px;right:24px;top:118px;z-index:6;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:930}}">
class Component extends DCLogic {
  state = { open: true, toast: null };

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2200);
  }

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    var self = this;
    var open = this.state.open;
    return {
      open: open ? "true" : "false",
      toast: this.state.toast,
      onOpen: function () { self.setState({ open: true }); },
      onClose: function () { self.setState({ open: false }); },
      onSwipeStart: function (e) { self._x = e.clientX; },
      onSwipeEnd: function (e) {
        if (self._x != null && self._x - e.clientX > 45) self.setState({ open: false });
        self._x = null;
      },
      onEdit: function () { self.ping("Edit profile — demo only."); },
      onTip: function () { self.ping("Tip jar — demo only. Thank you, genuinely."); },
      onRow: function () { self.ping("Demo only."); },
      onSignOut: function () { self.ping("Signed out — demo only."); }
    };
  }
}

</script>
</body>
