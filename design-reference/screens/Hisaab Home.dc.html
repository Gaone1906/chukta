    <div style="position:absolute;left:0;right:0;bottom:0;height:150px;z-index:3;pointer-events:none;background:linear-gradient(180deg, rgba(10,4,5,0) 0%, rgba(10,4,5,.72) 58%, rgba(10,4,5,.94) 100%)"></div>

    <button type="button" onClick="{{ onAdd }}" aria-label="Add an expense" style="position:absolute;right:24px;bottom:46px;z-index:4;display:flex;align-items:center;justify-content:center;width:62px;height:62px;padding:0;border-radius:31px;border:1px solid rgba(184,150,60,.6);background:rgba(184,150,60,.2);backdrop-filter:blur(20px) saturate(175%);box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 12px 34px rgba(0,0,0,.55), 0 0 26px rgba(184,150,60,.22);cursor:pointer;transition:transform .16s ease, background .18s ease, border-color .18s ease" style-hover="background:rgba(184,150,60,.3);border-color:rgba(184,150,60,.9)" style-active="transform:scale(.94);background:rgba(184,150,60,.4)">

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:940}}">
class Component extends DCLogic {
  state = { tab: "groups", toast: null };

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2200);
  }

  componentWillUnmount() {
    clearTimeout(this._t);
    if (this._list && this._onTap) this._list.removeEventListener("rowtap", this._onTap);
  }

  bindList(el) {
    if (this._list === el) return;
    if (this._list && this._onTap) this._list.removeEventListener("rowtap", this._onTap);
    this._list = el;
    if (!el) return;
    this._onTap = function (e) {
      var name = (e.detail && e.detail.name) || "the ledger";
      this.ping("Opening " + name + " — demo only.");
    }.bind(this);
    el.addEventListener("rowtap", this._onTap);
  }

  renderVals() {
    var self = this;
    var tab = this.state.tab;
    return {
      tab: tab,
      isGroups: tab === "groups",
      isPeople: tab === "people",
      toast: this.state.toast,
      onToggle: function () { self.setState({ tab: tab === "groups" ? "people" : "groups" }); },
      onMenu: function () { self.ping("Profile sidebar — demo only."); },
      listRef: function (el) { self.bindList(el); },
      onAdd: function () { self.ping("New expense — demo only."); }
    };
  }
}

</script>
