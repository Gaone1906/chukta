<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#050203;padding:40px 24px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">

  <div style="position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:44px;background:#0A0405;box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

    <div style="position:absolute;inset:0;border-radius:44px;overflow:hidden;background:radial-gradient(120% 76% at 45% 26%, #241014 0%, #120809 55%, #0A0405 100%);filter:blur(3px) saturate(.7)">
      <div style="position:absolute;top:150px;left:26px;right:150px;height:52px;border-radius:18px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03)"></div>
      <div style="position:absolute;top:222px;left:26px;right:26px;height:46px;border-radius:18px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03)"></div>
    </div>

    <div style="{{ sheetStyle }}">
      <div style="position:absolute;inset:0;overflow:hidden;border-radius:44px;background:radial-gradient(120% 78% at 50% 40%, #2A1216 0%, #150A0C 48%, #0A0405 100%)">
        <div style="position:absolute;top:-140px;left:-120px;width:330px;height:330px;border-radius:50%;background:#7A2833;filter:blur(56px);opacity:.46;animation:hs-drift 18s ease-in-out infinite"></div>
        <div style="position:absolute;top:330px;right:-160px;width:300px;height:300px;border-radius:50%;background:#B8963C;filter:blur(52px);opacity:.24;animation:hs-drift2 22s ease-in-out infinite"></div>
        <div style="position:absolute;bottom:-180px;left:-90px;width:380px;height:330px;border-radius:50%;background:#7A2833;filter:blur(60px);opacity:.4;animation:hs-drift 26s ease-in-out infinite"></div>
      </div>

      <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 14px 'Hind',sans-serif;color:rgba(255,255,255,.9);z-index:4">
        <span>9:41</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="display:block;width:17px;height:11px;border-radius:2px;background:rgba(255,255,255,.9)"></span>
          <span style="display:block;width:15px;height:11px;border-radius:2px;background:rgba(255,255,255,.55)"></span>
          <span style="display:block;width:24px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);position:relative"><span style="position:absolute;top:2px;left:2px;bottom:2px;width:14px;border-radius:1.5px;background:rgba(255,255,255,.9)"></span></span>
        </div>
      </div>

      <button type="button" onClick="{{ onBack }}" aria-label="Back" style="position:absolute;left:22px;top:66px;z-index:5;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:21px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .16s ease, border-color .18s ease, background .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.1)" style-active="transform:scale(.94);border-color:rgba(184,150,60,.85)">
        <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5 2 7.5l5.5 6" stroke="rgba(244,237,228,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>

      <div style="position:relative;z-index:2;height:100%;box-sizing:border-box;padding:120px 26px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center">

        <x-import component-from-global-scope="hisaab-seal" from="../assets/hisaab-seal.js" size="132" state="settled" label="" hint-size="146px,146px" style="display:block"></x-import>

        <span style="margin-top:22px;font-family:'Rozha One',serif;font-size:44px;line-height:1;color:#F4EDE4;letter-spacing:.5px;text-shadow:0 2px 24px rgba(184,150,60,.2)">Hisaab</span>

        <span style="margin-top:12px;max-width:280px;text-align:center;text-wrap:pretty;font:300 14.5px/1.55 'Hind',sans-serif;color:rgba(255,255,255,.5)">Built to stay free forever. No ads, no paywalls, no subscriptions — just a quiet ledger between friends.</span>

        <span style="margin-top:14px;font:300 11.5px 'Hind',sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.26)">Version 1.0.0</span>

        <div style="margin-top:30px;width:100%;max-width:300px;position:relative;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);backdrop-filter:blur(23px) saturate(180%);-webkit-backdrop-filter:blur(23px) saturate(180%);box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2)">
          <div style="position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);pointer-events:none"></div>

          <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
            <button type="button" onClick="{{ l.onTap }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 17px;box-sizing:border-box;text-align:left;border:none;border-top:1px solid rgba(255,255,255,.08);background:none;cursor:pointer;transition:background .18s ease" style-hover="background:rgba(255,255,255,.05)" style-active="background:rgba(255,255,255,.09)">
              <span style="flex:1;font:400 15px 'Hind',sans-serif;color:{{ l.color }};letter-spacing:.1px">{{ l.label }}</span>
              <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1.5 1l4 5-4 5" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
          </sc-for>
        </div>

        <div style="flex:1;min-height:24px"></div>

        <span style="max-width:280px;text-align:center;text-wrap:pretty;font:300 11.5px/1.6 'Hind',sans-serif;color:rgba(255,255,255,.24)">Made by one developer in Bengaluru who split too many dinner bills. No investors, no ad-tech, no growth team.</span>

        <div style="margin-top:18px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
      </div>
    </div>

    <div style="position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;border-radius:44px">
      <sc-for list="{{ rings }}" as="r" hint-placeholder-count="3">
        <div style="{{ r.style }}"></div>
      </sc-for>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:22px;right:22px;top:112px;z-index:10;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>

  <button type="button" onClick="{{ onReplay }}" style="padding:9px 16px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(255,255,255,.05);cursor:pointer;font:400 10.5px 'Hind',sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.4);transition:color .18s ease, border-color .18s ease" style-hover="color:#D9B65A;border-color:rgba(184,150,60,.5)">Replay the ripple</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:940}}">
var W = 390, H = 844;
var IN_ORIGIN = { x: 60, y: 520 };    // the About row in the sidebar
var BACK_ORIGIN = { x: 45, y: 87 };
var EASE = function (t) { return 1 - Math.pow(1 - t, 2.6); };

var LINKS = [
  { label: "Terms of Service", tone: "rgba(244,237,228,.85)" },
  { label: "Privacy Policy", tone: "rgba(244,237,228,.85)" },
  { label: "Rate Hisaab", tone: "rgba(244,237,228,.85)" },
  { label: "Tip jar", tone: "#D9B65A" }
];

function rMaxFrom(o) {
  return Math.max(
    Math.hypot(o.x, o.y), Math.hypot(W - o.x, o.y),
    Math.hypot(o.x, H - o.y), Math.hypot(W - o.x, H - o.y)
  );
}

class Component extends DCLogic {
  state = { p: 0, origin: IN_ORIGIN, closing: false, toast: null };

  componentDidMount() { this.reveal(); }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._t); clearTimeout(this._t2); }

  animate(from, to, origin, closing, done) {
    cancelAnimationFrame(this._raf);
    var self = this, t0 = performance.now(), dur = 950;
    this.setState({ origin: origin, closing: closing });
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur);
      self.setState({ p: from + (to - from) * t });
      if (t < 1) self._raf = requestAnimationFrame(step);
      else if (done) done();
    };
    this._raf = requestAnimationFrame(step);
  }

  reveal() { this.animate(0, 1, IN_ORIGIN, false); }

  close() {
    var self = this;
    this.animate(1, 0, BACK_ORIGIN, true, function () {
      self._t2 = setTimeout(function () { self.reveal(); }, 420);
    });
  }

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2200);
  }

  renderVals() {
    var self = this;
    var p = this.state.p, o = this.state.origin, rMax = rMaxFrom(o);
    var eased = this.state.closing ? p : EASE(p);
    var r = eased * rMax;
    var mid = p > 0.01 && p < 0.99;

    return {
      sheetStyle: "position:absolute;inset:0;z-index:3;overflow:hidden;border-radius:44px;" +
        "clip-path:circle(" + r.toFixed(1) + "px at " + o.x + "px " + o.y + "px);" +
        "-webkit-clip-path:circle(" + r.toFixed(1) + "px at " + o.x + "px " + o.y + "px);",
      rings: [0, 1, 2].map(function (i) {
        var rr = Math.max(0, r - i * rMax * 0.085);
        var op = mid ? Math.min(1, (1 - Math.abs(0.5 - p) * 1.2)) * (i === 0 ? 0.85 : i === 1 ? 0.48 : 0.26) : 0;
        return {
          style: "position:absolute;left:" + o.x + "px;top:" + o.y + "px;width:" + (rr * 2).toFixed(0) + "px;height:" +
            (rr * 2).toFixed(0) + "px;border-radius:50%;border:1px solid rgba(184,150,60,.6);transform:translate(-50%,-50%);" +
            "filter:blur(" + (i ? i * 1.3 : 0.5) + "px);opacity:" + op.toFixed(3) + ";pointer-events:none"
        };
      }),
      links: LINKS.map(function (l) {
        return {
          label: l.label, color: l.tone,
          onTap: function () { self.ping(l.label + " — demo only."); }
        };
      }),
      toast: this.state.toast,
      onBack: function () { self.close(); },
      onReplay: function () { self.close(); }
    };
  }
}

</script>
</body>
</html>
