name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The money engine is the one place a bug costs users real money.
      # These are property tests — see plan/phase-02-core-money.md.
      - name: Test
        run: npm run test

  database:
    name: Migrations apply cleanly · pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres
        run: supabase db start

      # Proves the migrations apply from nothing, not just that they applied once locally.
      - name: Reset from scratch
        run: supabase db reset

      # Allocator parity with @hisaab/core, the sum invariant, idempotency, and — the one that
      # actually matters — that a member of one group reads zero rows from another's.
      - name: pgTAP
        run: supabase test db
