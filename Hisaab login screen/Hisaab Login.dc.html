<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  @keyframes hs-press { from{opacity:0;transform:scale(1.16) rotate(-6deg)} to{opacity:1;transform:none} }
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050203;padding:24px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">
  <div style="position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;background:radial-gradient(120% 80% at 50% 22%, #2A1216 0%, #150A0C 45%, #0A0405 100%);box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
      <div style="position:absolute;top:-140px;left:-120px;width:340px;height:340px;border-radius:50%;background:#7A2833;filter:blur(56px);opacity:.5;animation:hs-drift 18s ease-in-out infinite"></div>
      <div style="position:absolute;top:230px;right:-150px;width:300px;height:300px;border-radius:50%;background:#B8963C;filter:blur(52px);opacity:.32;animation:hs-drift2 22s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-180px;left:-70px;width:380px;height:330px;border-radius:50%;background:#7A2833;filter:blur(60px);opacity:.45;animation:hs-drift 26s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-100px;right:-120px;width:240px;height:240px;border-radius:50%;background:#B8963C;filter:blur(58px);opacity:.2;animation:hs-drift2 30s ease-in-out infinite"></div>
    </div>

    <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 14px 'Hind',sans-serif;color:rgba(255,255,255,.9);letter-spacing:.2px;z-index:3">
      <span>9:41</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="display:block;width:17px;height:11px;border-radius:2px;background:rgba(255,255,255,.9)"></span>
        <span style="display:block;width:15px;height:11px;border-radius:2px;background:rgba(255,255,255,.55)"></span>
        <span style="display:block;width:24px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);position:relative"><span style="position:absolute;top:2px;left:2px;bottom:2px;width:14px;border-radius:1.5px;background:rgba(255,255,255,.9)"></span></span>
      </div>
    </div>

    <div style="position:relative;z-index:2;height:100%;box-sizing:border-box;padding:96px 26px 26px;display:flex;flex-direction:column;align-items:center">

      <x-import component-from-global-scope="hisaab-seal" from="./assets/hisaab-seal.js" size="212" state="settled" label="" hint-size="232px,232px" style="display:block"></x-import>

      <div style="margin-top:34px;max-width:272px;text-align:center;text-wrap:pretty;font:300 15.5px/1.45 'Hind',sans-serif;color:rgba(255,255,255,.5);animation:hs-rise 700ms 280ms cubic-bezier(.2,.9,.25,1) both">{{ tagline }}</div>

      <div style="flex:1"></div>

      <div style="width:100%;border-radius:30px;padding:22px 20px 20px;box-sizing:border-box;position:relative;overflow:hidden;background:rgba(255,255,255,0.05);backdrop-filter:blur(23px) saturate(180%);-webkit-backdrop-filter:blur(23px) saturate(180%);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.04);animation:hs-rise 800ms 380ms cubic-bezier(.2,.9,.25,1) both">
        <div style="position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);pointer-events:none"></div>

        <div style="display:flex;flex-direction:column;gap:11px">
          <button type="button" onClick="{{ onApple }}" style="position:relative;display:flex;align-items:center;width:100%;height:54px;padding:0 18px;box-sizing:border-box;border:1px solid rgba(255,255,255,.14);border-radius:27px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .16s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.11)" style-active="transform:scale(.982);border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 3px rgba(184,150,60,.12)">
            <svg width="18" height="21" viewBox="0 0 18 21" fill="none" style="position:absolute;left:18px;top:50%;transform:translateY(-50%)">
              <path d="M14.9 11.1c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.1-2.8.9-3.5.9-.7 0-1.8-.9-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7 1.4 0 1.8.7 3 .7 1.2 0 2-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.5Z" fill="rgba(244,237,228,.92)"></path>
              <path d="M12.6 3.6c.6-.8 1-1.8.9-2.9-.9.1-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.6-1.3Z" fill="rgba(244,237,228,.92)"></path>
            </svg>
            <span style="flex:1;text-align:center;font:500 16px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.1px">Continue with Apple</span>
          </button>

          <button type="button" onClick="{{ onGoogle }}" style="position:relative;display:flex;align-items:center;width:100%;height:54px;padding:0 18px;box-sizing:border-box;border:1px solid rgba(255,255,255,.14);border-radius:27px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .16s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.11)" style-active="transform:scale(.982);border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 3px rgba(184,150,60,.12)">
            <svg width="19" height="19" viewBox="0 0 20 20" style="position:absolute;left:18px;top:50%;transform:translateY(-50%)">
              <path fill="#4285F4" d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.9h5.4c-.2 1.2-1 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"></path>
              <path fill="#34A853" d="M10 20c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H1.1v2.6C2.8 17.9 6.1 20 10 20Z"></path>
              <path fill="#FBBC05" d="M4.4 12c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V5.4H1.1A10 10 0 0 0 0 10c0 1.6.4 3.2 1.1 4.6L4.4 12Z"></path>
              <path fill="#EA4335" d="M10 4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C14.9 1 12.7 0 10 0 6.1 0 2.8 2.1 1.1 5.4L4.4 8c.8-2.3 3-4 5.6-4Z"></path>
            </svg>
            <span style="flex:1;text-align:center;font:500 16px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.1px">Continue with Google</span>
          </button>

          <button type="button" onClick="{{ onPhone }}" style="position:relative;display:flex;align-items:center;width:100%;height:54px;padding:0 18px;box-sizing:border-box;border:1px solid rgba(255,255,255,.14);border-radius:27px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .16s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.11)" style-active="transform:scale(.982);border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 3px rgba(184,150,60,.12)">
            <svg width="17" height="20" viewBox="0 0 17 20" fill="none" style="position:absolute;left:19px;top:50%;transform:translateY(-50%)">
              <rect x="1" y="1" width="15" height="18" rx="4" stroke="#D9B65A" stroke-width="1.4"></rect>
              <rect x="6" y="15" width="5" height="1.6" rx="0.8" fill="#D9B65A"></rect>
            </svg>
            <span style="flex:1;text-align:center;font:500 16px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.1px">Continue with phone number</span>
          </button>
        </div>

        <div style="margin-top:18px;text-align:center;font:300 11.5px/1.5 'Hind',sans-serif;color:rgba(255,255,255,.34);letter-spacing:.15px">
          By continuing you agree to our <a href="#" style="color:rgba(255,255,255,.52);border-bottom:1px solid rgba(184,150,60,.4)">Terms</a> and <a href="#" style="color:rgba(255,255,255,.52);border-bottom:1px solid rgba(184,150,60,.4)">Privacy Policy</a>.
        </div>
      </div>

      <div style="margin-top:16px;display:flex;align-items:center;gap:10px;font:400 10.5px 'Hind',sans-serif;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.22)">
        <span style="display:block;width:22px;height:1px;background:rgba(255,255,255,.16)"></span>
        <span>{{ footnote }}</span>
        <span style="display:block;width:22px;height:1px;background:rgba(255,255,255,.16)"></span>
      </div>

      <div style="margin-top:14px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:26px;right:26px;bottom:118px;z-index:5;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;tagline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;awkward&quot;,&quot;ledger&quot;,&quot;polite&quot;],&quot;default&quot;:&quot;awkward&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;footnote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Est. between friends&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;}}">
class Component extends DCLogic {
  state = { toast: null };

  lines = {
    awkward: "We keep the running total, so nobody has to bring it up at dinner.",
    ledger: "A quiet ledger between friends. No 2am reminders. Unless you ask.",
    polite: "Somebody has to remember who paid for the taxi. Happily, not you."
  };

  ping(label) {
    clearTimeout(this._t);
    this.setState({ toast: label + " - demo only, no account created." });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2400);
  }

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    var self = this;
    return {
      tagline: this.lines[this.props.tagline] || this.lines.awkward,
      footnote: this.props.footnote || "Est. between friends",
      toast: this.state.toast,
      onApple: function () { self.ping("Apple"); },
      onGoogle: function () { self.ping("Google"); },
      onPhone: function () { self.ping("Phone"); }
    };
  }
}

</script>
</body>
</html>
