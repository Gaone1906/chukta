<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:930}}">
class Component extends DCLogic {
  state = { toast: null };

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2200);
  }

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    var self = this;
    return {
      toast: this.state.toast,
      onBack: function () { self.ping("Back to People — demo only."); },
      onSettle: function () { self.ping("Settle ₹1,420 with Priya — demo only."); },
      onExpense: function () { self.ping("Expense detail — demo only."); },
      onAdd: function () { self.ping("New expense with Priya — demo only."); }
    };
  }
}

</script>
