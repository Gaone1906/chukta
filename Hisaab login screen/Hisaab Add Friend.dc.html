<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  input.hs-search { -webkit-appearance:none; caret-color:#D9B65A; }
  input.hs-search:focus { outline:none; }
  input.hs-search::placeholder { color:rgba(255,255,255,.26); font-weight:300; }
  .hs-searchwrap:focus-within { border-color:rgba(184,150,60,.7) !important; background:rgba(184,150,60,.1) !important; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.12) !important; }
  .hs-scroll::-webkit-scrollbar { width:0; height:0; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#050203;padding:40px 24px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">

  <div style="position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:44px;background:#0A0405;box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

    <div style="position:absolute;inset:0;border-radius:44px;overflow:hidden;background:radial-gradient(120% 76% at 55% 26%, #241014 0%, #120809 55%, #0A0405 100%);filter:blur(3px) saturate(.7)">
      <div style="position:absolute;top:170px;left:26px;right:26px;height:60px;border-radius:22px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03)"></div>
      <div style="position:absolute;top:250px;left:26px;right:26px;height:76px;border-radius:22px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03)"></div>
      <div style="position:absolute;top:340px;left:26px;right:26px;height:76px;border-radius:22px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03)"></div>
    </div>

    <div style="{{ sheetStyle }}">
      <div style="position:absolute;inset:0;overflow:hidden;border-radius:44px;background:radial-gradient(120% 76% at 50% 16%, #2A1216 0%, #150A0C 46%, #0A0405 100%)">
        <div style="position:absolute;top:-150px;left:-120px;width:330px;height:330px;border-radius:50%;background:#7A2833;filter:blur(56px);opacity:.5;animation:hs-drift 18s ease-in-out infinite"></div>
        <div style="position:absolute;top:300px;right:-160px;width:300px;height:300px;border-radius:50%;background:#B8963C;filter:blur(52px);opacity:.24;animation:hs-drift2 22s ease-in-out infinite"></div>
        <div style="position:absolute;bottom:-180px;left:-90px;width:380px;height:330px;border-radius:50%;background:#7A2833;filter:blur(60px);opacity:.42;animation:hs-drift 26s ease-in-out infinite"></div>
      </div>

      <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 14px 'Hind',sans-serif;color:rgba(255,255,255,.9);z-index:4">
        <span>9:41</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="display:block;width:17px;height:11px;border-radius:2px;background:rgba(255,255,255,.9)"></span>
          <span style="display:block;width:15px;height:11px;border-radius:2px;background:rgba(255,255,255,.55)"></span>
          <span style="display:block;width:24px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);position:relative"><span style="position:absolute;top:2px;left:2px;bottom:2px;width:14px;border-radius:1.5px;background:rgba(255,255,255,.9)"></span></span>
        </div>
      </div>

      <div style="position:relative;z-index:2;height:100%;box-sizing:border-box;padding:66px 22px 0;display:flex;flex-direction:column">

        <button type="button" onClick="{{ onBack }}" aria-label="Back" style="align-self:flex-start;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:21px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .16s ease, border-color .18s ease, background .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.1)" style-active="transform:scale(.94);border-color:rgba(184,150,60,.85)">
          <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5 2 7.5l5.5 6" stroke="rgba(244,237,228,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

        <div style="margin-top:16px;font-family:'Rozha One',serif;font-size:38px;line-height:1.06;color:#F4EDE4;letter-spacing:.4px;text-shadow:0 2px 24px rgba(184,150,60,.16)">Add a friend</div>

        <div class="hs-searchwrap" style="margin-top:18px;display:flex;align-items:center;gap:11px;height:52px;padding:0 16px;box-sizing:border-box;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px) saturate(175%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);transition:border-color .18s ease, background .18s ease, box-shadow .18s ease">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="7.6" cy="7.6" r="5.4" stroke="rgba(244,237,228,.55)" stroke-width="1.4"></circle><path d="M11.6 11.6 16 16" stroke="rgba(244,237,228,.55)" stroke-width="1.4" stroke-linecap="round"></path></svg>
          <input class="hs-search" type="text" aria-label="Search by name or phone number" placeholder="Search by name or phone number" style="flex:1;min-width:0;border:none;background:none;font:400 15px 'Hind',sans-serif;color:#F4EDE4" />
        </div>

        <div class="hs-scroll" style="margin-top:18px;flex:1;overflow-y:auto;padding-bottom:60px;display:flex;flex-direction:column;gap:16px">

          <div style="display:flex;flex-direction:column;gap:11px">
            <span style="font:400 10.5px 'Hind',sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.3)">Already on Hisaab</span>

            <div style="display:flex;align-items:center;gap:13px;padding:12px 14px 12px 13px;box-sizing:border-box;border:1px solid rgba(184,150,60,.32);border-radius:22px;background:rgba(184,150,60,.08);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 6px 20px rgba(0,0,0,.28)">
              <span style="flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:21px;border:1px solid rgba(255,255,255,.16);background:rgba(184,150,60,.28);font:500 14.5px 'Hind',sans-serif;color:#F4EDE4">NK</span>
              <span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font:500 16px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.1px">Nikhil Kulkarni</span>
                <span style="font:300 12.5px 'Hind',sans-serif;color:rgba(184,150,60,.8)">On Hisaab · +91 98330 11224</span>
              </span>
              <button type="button" onClick="{{ onAdd }}" style="flex:none;display:flex;align-items:center;justify-content:center;height:36px;padding:0 18px;box-sizing:border-box;border:1px solid rgba(184,150,60,.6);border-radius:18px;background:rgba(184,150,60,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);cursor:pointer;font:600 13.5px 'Hind',sans-serif;color:#F6E9CB;letter-spacing:.2px;transition:transform .16s ease, background .18s ease, border-color .18s ease" style-hover="background:rgba(184,150,60,.3);border-color:rgba(184,150,60,.9)" style-active="transform:scale(.96);background:rgba(184,150,60,.4)">Add</button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:11px">
            <span style="font:400 10.5px 'Hind',sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.3)">Contacts</span>

            <span style="font:300 12.5px/1.5 'Hind',sans-serif;color:rgba(255,255,255,.34);text-wrap:pretty">Inviting a friend shares a link to install Hisaab — no account needed for them to see a shared expense first.</span>

            <sc-for list="{{ contacts }}" as="c" hint-placeholder-count="6">
              <div style="display:flex;align-items:center;gap:13px;padding:12px 14px 12px 13px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.05);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 6px 20px rgba(0,0,0,.28)">
                <span style="flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:21px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);font:500 14.5px 'Hind',sans-serif;color:rgba(244,237,228,.85)">{{ c.initials }}</span>
                <span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
                  <span style="font:500 16px 'Hind',sans-serif;color:#F4EDE4;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.name }}</span>
                  <span style="font:300 12.5px 'Hind',sans-serif;color:rgba(255,255,255,.4)">{{ c.phone }}</span>
                </span>
                <button type="button" onClick="{{ c.onInvite }}" style="{{ c.btnStyle }}">{{ c.btnLabel }}</button>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
      </div>
    </div>

    <div style="position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;border-radius:44px">
      <sc-for list="{{ rings }}" as="r" hint-placeholder-count="3">
        <div style="{{ r.style }}"></div>
      </sc-for>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:22px;right:22px;top:112px;z-index:10;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>

  <button type="button" onClick="{{ onReplay }}" style="padding:9px 16px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(255,255,255,.05);cursor:pointer;font:400 10.5px 'Hind',sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.4);transition:color .18s ease, border-color .18s ease" style-hover="color:#D9B65A;border-color:rgba(184,150,60,.5)">Replay the ripple</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:940}}">
var W = 390, H = 844;
var IN_ORIGIN = { x: 337, y: 767 };
var BACK_ORIGIN = { x: 45, y: 87 };
var EASE = function (t) { return 1 - Math.pow(1 - t, 2.6); };

function rMaxFrom(o) {
  return Math.max(
    Math.hypot(o.x, o.y), Math.hypot(W - o.x, o.y),
    Math.hypot(o.x, H - o.y), Math.hypot(W - o.x, H - o.y)
  );
}

var PEOPLE = [
  { initials: "SD", name: "Sanya Desai", phone: "+91 99201 40388" },
  { initials: "TM", name: "Tanmay Mishra", phone: "+91 98700 55231" },
  { initials: "FR", name: "Farah Rizvi", phone: "+91 90042 78115" },
  { initials: "GK", name: "Gaurav Khanna", phone: "+91 98450 61207" },
  { initials: "IB", name: "Ishita Bose", phone: "+91 97110 33994" },
  { initials: "RD", name: "Rohan D'Souza", phone: "+91 96540 21877" }
];

class Component extends DCLogic {
  state = { p: 0, origin: IN_ORIGIN, closing: false, invited: [], toast: null };

  componentDidMount() { this.open(); }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._t); clearTimeout(this._t2); }

  animate(from, to, origin, closing, done) {
    cancelAnimationFrame(this._raf);
    var self = this, t0 = performance.now(), dur = 950;
    this.setState({ origin: origin, closing: closing });
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur);
      self.setState({ p: from + (to - from) * t });
      if (t < 1) self._raf = requestAnimationFrame(step);
      else if (done) done();
    };
    this._raf = requestAnimationFrame(step);
  }

  open() { this.animate(0, 1, IN_ORIGIN, false); }

  close() {
    var self = this;
    this.animate(1, 0, BACK_ORIGIN, true, function () {
      self._t2 = setTimeout(function () { self.open(); }, 420);
    });
  }

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2200);
  }

  renderVals() {
    var self = this;
    var p = this.state.p, o = this.state.origin, rMax = rMaxFrom(o);
    var eased = this.state.closing ? p : EASE(p);
    var r = eased * rMax;
    var mid = p > 0.01 && p < 0.99;
    var invited = this.state.invited;

    var base = "flex:none;display:flex;align-items:center;justify-content:center;height:36px;padding:0 16px;box-sizing:border-box;border-radius:18px;cursor:pointer;font:500 13.5px 'Hind',sans-serif;letter-spacing:.2px;transition:transform .16s ease, background .18s ease, border-color .18s ease, color .18s ease;";
    var idle = base + "border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:rgba(244,237,228,.85);";
    var sent = base + "border:1px solid rgba(184,150,60,.5);background:rgba(184,150,60,.14);color:rgba(246,233,203,.75);";

    return {
      sheetStyle: "position:absolute;inset:0;z-index:3;overflow:hidden;border-radius:44px;" +
        "clip-path:circle(" + r.toFixed(1) + "px at " + o.x + "px " + o.y + "px);" +
        "-webkit-clip-path:circle(" + r.toFixed(1) + "px at " + o.x + "px " + o.y + "px);",
      rings: [0, 1, 2].map(function (i) {
        var rr = Math.max(0, r - i * rMax * 0.085);
        var op = mid ? Math.min(1, (1 - Math.abs(0.5 - p) * 1.2)) * (i === 0 ? 0.85 : i === 1 ? 0.48 : 0.26) : 0;
        return {
          style: "position:absolute;left:" + o.x + "px;top:" + o.y + "px;width:" + (rr * 2).toFixed(0) + "px;height:" +
            (rr * 2).toFixed(0) + "px;border-radius:50%;border:1px solid rgba(184,150,60,.6);transform:translate(-50%,-50%);" +
            "filter:blur(" + (i ? i * 1.3 : 0.5) + "px);opacity:" + op.toFixed(3) + ";pointer-events:none"
        };
      }),
      contacts: PEOPLE.map(function (c) {
        var done = invited.indexOf(c.name) > -1;
        return {
          initials: c.initials, name: c.name, phone: c.phone,
          btnLabel: done ? "Invited" : "Invite",
          btnStyle: done ? sent : idle,
          onInvite: function () {
            if (done) return;
            self.setState({ invited: invited.concat([c.name]) });
            self.ping("Invite link sent to " + c.name.split(" ")[0] + ".");
          }
        };
      }),
      toast: this.state.toast,
      onAdd: function () { self.ping("Nikhil added — you can split with him now."); },
      onBack: function () { self.close(); },
      onReplay: function () { self.close(); }
    };
  }
}

</script>
</body>
</html>
