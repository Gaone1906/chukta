<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  input.hs-otp { -webkit-appearance:none; caret-color:#D9B65A; }
  input.hs-otp:focus { outline:none; border-color:rgba(184,150,60,.85) !important; background:rgba(184,150,60,.12) !important; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25) !important; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050203;padding:24px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">
  <div style="position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;background:radial-gradient(120% 80% at 50% 26%, #2A1216 0%, #150A0C 45%, #0A0405 100%);box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
      <div style="position:absolute;top:-150px;right:-120px;width:330px;height:330px;border-radius:50%;background:#7A2833;filter:blur(56px);opacity:.5;animation:hs-drift 18s ease-in-out infinite"></div>
      <div style="position:absolute;top:250px;left:-160px;width:300px;height:300px;border-radius:50%;background:#B8963C;filter:blur(52px);opacity:.3;animation:hs-drift2 22s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-180px;right:-70px;width:380px;height:330px;border-radius:50%;background:#7A2833;filter:blur(60px);opacity:.45;animation:hs-drift 26s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-110px;left:-120px;width:240px;height:240px;border-radius:50%;background:#B8963C;filter:blur(58px);opacity:.2;animation:hs-drift2 30s ease-in-out infinite"></div>
    </div>

    <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 14px 'Hind',sans-serif;color:rgba(255,255,255,.9);letter-spacing:.2px;z-index:3">
      <span>9:41</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="display:block;width:17px;height:11px;border-radius:2px;background:rgba(255,255,255,.9)"></span>
        <span style="display:block;width:15px;height:11px;border-radius:2px;background:rgba(255,255,255,.55)"></span>
        <span style="display:block;width:24px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);position:relative"><span style="position:absolute;top:2px;left:2px;bottom:2px;width:14px;border-radius:1.5px;background:rgba(255,255,255,.9)"></span></span>
      </div>
    </div>

    <div style="position:relative;z-index:2;height:100%;box-sizing:border-box;padding:70px 26px 26px;display:flex;flex-direction:column;align-items:center">

      <button type="button" onClick="{{ onBack }}" aria-label="Back" style="position:absolute;left:22px;top:66px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:border-color .18s ease, background .18s ease" style-hover="border-color:rgba(184,150,60,.5);background:rgba(255,255,255,.1)" style-active="border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.14)">
        <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5 2 7.5l5.5 6" stroke="rgba(244,237,228,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>

      <div style="margin-top:6px;display:flex;align-items:center;gap:9px;animation:hs-rise 620ms cubic-bezier(.2,.9,.25,1) both">
        <span style="display:block;width:20px;height:1px;background:rgba(184,150,60,.5)"></span>
        <span style="font:500 10.5px 'Hind',sans-serif;letter-spacing:2.6px;text-transform:uppercase;color:rgba(184,150,60,.85)">Step 2 of 3</span>
        <span style="display:block;width:20px;height:1px;background:rgba(184,150,60,.5)"></span>
      </div>

      <div style="margin-top:18px;font-family:'Rozha One',serif;font-size:40px;line-height:1.05;color:#F4EDE4;letter-spacing:.4px;animation:hs-rise 640ms 100ms cubic-bezier(.2,.9,.25,1) both;text-shadow:0 2px 24px rgba(184,150,60,.18)">Enter the code</div>

      <div style="margin-top:10px;display:flex;align-items:baseline;gap:8px;font:300 15px 'Hind',sans-serif;color:rgba(255,255,255,.5);animation:hs-rise 640ms 180ms cubic-bezier(.2,.9,.25,1) both">
        <span>{{ phone }}</span>
        <button type="button" onClick="{{ onEdit }}" style="padding:0;border:none;background:none;cursor:pointer;font:500 14px 'Hind',sans-serif;color:#D9B65A;border-bottom:1px solid rgba(184,150,60,.45);transition:color .18s ease" style-hover="color:#E4C878">Edit</button>
      </div>

      <div style="flex:1"></div>

      <div style="width:100%;border-radius:30px;padding:24px 20px 20px;box-sizing:border-box;position:relative;overflow:hidden;background:rgba(255,255,255,0.05);backdrop-filter:blur(23px) saturate(180%);-webkit-backdrop-filter:blur(23px) saturate(180%);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.04);animation:hs-rise 760ms 260ms cubic-bezier(.2,.9,.25,1) both">
        <div style="position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);pointer-events:none"></div>

        <div ref="{{ rowRef }}" onInput="{{ onInput }}" onKeyDown="{{ onKeyDown }}" onPaste="{{ onPaste }}" style="display:grid;grid-template-columns:repeat(6,1fr);gap:9px">
          <input class="hs-otp" data-i="0" inputMode="numeric" maxLength="1" autoComplete="one-time-code" aria-label="Digit 1" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
          <input class="hs-otp" data-i="1" inputMode="numeric" maxLength="1" aria-label="Digit 2" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
          <input class="hs-otp" data-i="2" inputMode="numeric" maxLength="1" aria-label="Digit 3" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
          <input class="hs-otp" data-i="3" inputMode="numeric" maxLength="1" aria-label="Digit 4" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
          <input class="hs-otp" data-i="4" inputMode="numeric" maxLength="1" aria-label="Digit 5" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
          <input class="hs-otp" data-i="5" inputMode="numeric" maxLength="1" aria-label="Digit 6" style="width:100%;height:58px;box-sizing:border-box;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:500 24px 'Hind',sans-serif;color:#F4EDE4;transition:border-color .18s ease, background .18s ease, box-shadow .18s ease" style-focus="outline:none;border-color:rgba(184,150,60,.85);background:rgba(184,150,60,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.14), 0 0 22px rgba(184,150,60,.25)" />
        </div>

        <div style="margin-top:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:rgba(255,255,255,.38);letter-spacing:.15px">{{ resend }}</div>

        <button type="button" onClick="{{ onVerify }}" style="margin-top:18px;position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:54px;box-sizing:border-box;border:1px solid rgba(184,150,60,.55);border-radius:27px;background:rgba(184,150,60,.16);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 6px 22px rgba(184,150,60,.16);cursor:pointer;transition:transform .16s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease" style-hover="background:rgba(184,150,60,.24);border-color:rgba(184,150,60,.8)" style-active="transform:scale(.982);background:rgba(184,150,60,.32);border-color:#B8963C;box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.16)">
          <span style="font:600 16px 'Hind',sans-serif;color:#F6E9CB;letter-spacing:.3px">Verify</span>
        </button>
      </div>

      <div style="margin-top:16px;text-align:center;max-width:280px;font:300 11.5px/1.5 'Hind',sans-serif;color:rgba(255,255,255,.3);letter-spacing:.15px">Standard message rates may apply. The code expires in ten minutes.</div>

      <div style="margin-top:14px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:26px;right:26px;top:120px;z-index:5;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+91 98765 43210&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;resendSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;min&quot;:0,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { left: null, toast: null };

  componentDidMount() {
    this.rowRef = this.rowRef || null;
    var start = this.props.resendSeconds || 28;
    this._iv = setInterval(function () {
      this.setState(function (s) {
        var cur = s.left === null ? start : s.left;
        return { left: cur > 0 ? cur - 1 : 0 };
      });
    }.bind(this), 1000);
  }

  componentWillUnmount() { clearInterval(this._iv); clearTimeout(this._t); }

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2400);
  }

  fields() {
    return this._row ? Array.prototype.slice.call(this._row.querySelectorAll("input")) : [];
  }

  renderVals() {
    var self = this;
    var left = this.state.left === null ? (this.props.resendSeconds || 28) : this.state.left;
    var mm = Math.floor(left / 60);
    var ss = left % 60 < 10 ? "0" + (left % 60) : String(left % 60);

    return {
      phone: "Sent to " + (this.props.phone || "+91 98765 43210"),
      resend: left > 0 ? "Resend code in " + mm + ":" + ss : "Didn't get it? Tap to resend.",
      toast: this.state.toast,
      rowRef: function (el) { self._row = el; },
      onInput: function (e) {
        var el = e.target;
        el.value = el.value.replace(/[^0-9]/g, "").slice(0, 1);
        var i = Number(el.getAttribute("data-i"));
        var f = self.fields();
        if (el.value && f[i + 1]) f[i + 1].focus();
      },
      onKeyDown: function (e) {
        var el = e.target, i = Number(el.getAttribute("data-i")), f = self.fields();
        if (e.key === "Backspace" && !el.value && f[i - 1]) { f[i - 1].focus(); f[i - 1].value = ""; e.preventDefault(); }
        if (e.key === "ArrowLeft" && f[i - 1]) f[i - 1].focus();
        if (e.key === "ArrowRight" && f[i + 1]) f[i + 1].focus();
      },
      onPaste: function (e) {
        var txt = (e.clipboardData && e.clipboardData.getData("text") || "").replace(/[^0-9]/g, "").slice(0, 6);
        if (!txt) return;
        e.preventDefault();
        var f = self.fields();
        for (var k = 0; k < f.length; k++) f[k].value = txt[k] || "";
        (f[Math.min(txt.length, 5)] || f[5]).focus();
      },
      onVerify: function () {
        var code = self.fields().map(function (x) { return x.value; }).join("");
        self.ping(code.length === 6 ? "Verifying " + code + "…" : "Enter all six digits.");
      },
      onEdit: function () { self.ping("Change number — demo only."); },
      onBack: function () { self.ping("Back to sign in — demo only."); }
    };
  }
}

</script>
</body>
</html>
