<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;forward&quot;,&quot;back&quot;],&quot;default&quot;:&quot;forward&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tapDot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
var W = 390, H = 844;
var FAB = { x: 337, y: 767 };
var BACK = { x: 45, y: 87 };
var EASE = function (t) { return 1 - Math.pow(1 - t, 2.6); };

class Component extends DCLogic {
  state = { p: null, dir: null };

  componentWillUnmount() { cancelAnimationFrame(this._raf); }

  run(dir) {
    cancelAnimationFrame(this._raf);
    var self = this, t0 = performance.now(), dur = 950;
    this.setState({ p: 0, dir: dir });
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur);
      self.setState({ p: t });
      if (t < 1) self._raf = requestAnimationFrame(step);
      else self.setState({ p: dir === "back" ? 0 : 1, dir: "forward" });
    };
    this._raf = requestAnimationFrame(step);
  }

  layer(z, revealing, p, origin, extra) {
    var s = "position:absolute;inset:0;z-index:" + z + ";overflow:hidden;border-radius:44px;";
    if (revealing) {
      var rMax = Math.max(
        Math.hypot(origin.x, origin.y), Math.hypot(W - origin.x, origin.y),
        Math.hypot(origin.x, H - origin.y), Math.hypot(W - origin.x, H - origin.y)
      );
      var r = EASE(p) * rMax;
      s += "clip-path:circle(" + r.toFixed(1) + "px at " + origin.x + "px " + origin.y + "px);";
      s += "-webkit-clip-path:circle(" + r.toFixed(1) + "px at " + origin.x + "px " + origin.y + "px);";
    }
    return s + (extra || "");
  }

  dissolve(p) {
    var e = EASE(p);
    return "filter:blur(" + (3.4 * e).toFixed(2) + "px) saturate(" + (1 - 0.28 * e).toFixed(2) + ");" +
           "transform:scale(" + (1 - 0.02 * e).toFixed(4) + ");";
  }

  renderVals() {
    var self = this;
    var mode = this.props.mode === "back" ? "back" : "forward";
    var live = !!this.props.live;
    var p = this.state.p !== null ? this.state.p : (this.props.progress != null ? Number(this.props.progress) : (mode === "back" ? 0 : 0));
    var dir = this.state.dir || mode;
    var origin = dir === "back" ? BACK : FAB;
    var mid = p > 0 && p < 1;

    // forward: form reveals over home. back: home reveals over form.
    var homeStyle, formStyle;
    if (dir === "back") {
      formStyle = this.layer(2, false, p, origin, this.dissolve(p));
      homeStyle = this.layer(3, p < 1, p, origin);
    } else {
      homeStyle = this.layer(2, false, p, origin, this.dissolve(p));
      formStyle = this.layer(3, p < 1, p, origin);
    }

    var rMax = Math.max(
      Math.hypot(origin.x, origin.y), Math.hypot(W - origin.x, origin.y),
      Math.hypot(origin.x, H - origin.y), Math.hypot(W - origin.x, H - origin.y)
    );
    var r = EASE(p) * rMax;
    var rings = [0, 1, 2].map(function (i) {
      var rr = Math.max(0, r - i * rMax * 0.085);
      var op = mid ? Math.max(0, 1 - p) * (i === 0 ? 0.9 : i === 1 ? 0.5 : 0.28) : 0;
      return {
        style: "position:absolute;left:" + origin.x + "px;top:" + origin.y + "px;width:" + (rr * 2).toFixed(0) +
          "px;height:" + (rr * 2).toFixed(0) + "px;border-radius:50%;border:1px solid rgba(184,150,60,.6);" +
          "transform:translate(-50%,-50%);filter:blur(" + (i ? i * 1.3 : 0.5) + "px);opacity:" + op.toFixed(3) + ";pointer-events:none"
      };
    });

    var showDot = this.props.tapDot === true || this.props.tapDot === "true";
    return {
      homeStyle: homeStyle,
      formStyle: formStyle,
      rings: rings,
      tapDot: showDot
        ? "position:absolute;left:" + origin.x + "px;top:" + origin.y + "px;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:1.5px solid rgba(184,150,60,.85);box-shadow:0 0 26px rgba(184,150,60,.4), inset 0 0 22px rgba(184,150,60,.22);z-index:10;pointer-events:none"
        : false,
      onFab: function () { if (live) self.run("forward"); },
      onBack: function () { if (live) self.run("back"); }
    };
  }
}

</script>
