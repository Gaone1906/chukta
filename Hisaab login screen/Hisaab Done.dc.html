<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#050203; }
  a { color:rgba(255,255,255,.55); text-decoration:none; }
  a:hover { color:#D9B65A; }
  @keyframes hs-drift { 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(14px,-18px,0) scale(1.06)} 100%{transform:translate3d(0,0,0) scale(1)} }
  @keyframes hs-drift2 { 0%{transform:translate3d(0,0,0) scale(1.04)} 50%{transform:translate3d(-18px,12px,0) scale(1)} 100%{transform:translate3d(0,0,0) scale(1.04)} }
  @keyframes hs-rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  @keyframes hs-spin { to { transform:rotate(360deg) } }
  @keyframes hs-stamp { 0%{opacity:0;transform:scale(1.5) rotate(-9deg);filter:blur(6px)} 55%{opacity:1;transform:scale(.965) rotate(1.5deg);filter:blur(0)} 78%{transform:scale(1.014) rotate(-.6deg)} 100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)} }
  @keyframes hs-halo { 0%{opacity:0;transform:scale(.7)} 40%{opacity:.55} 100%{opacity:0;transform:scale(1.5)} }
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050203;padding:24px;box-sizing:border-box;font-family:'Hind',system-ui,sans-serif">
  <div style="position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;background:radial-gradient(120% 78% at 50% 44%, #2A1216 0%, #150A0C 46%, #0A0405 100%);box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06)">

    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
      <div style="position:absolute;top:-140px;left:-120px;width:340px;height:340px;border-radius:50%;background:#7A2833;filter:blur(56px);opacity:.5;animation:hs-drift 18s ease-in-out infinite"></div>
      <div style="position:absolute;top:300px;right:-150px;width:310px;height:310px;border-radius:50%;background:#B8963C;filter:blur(52px);opacity:.32;animation:hs-drift2 22s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:-170px;left:-90px;width:380px;height:330px;border-radius:50%;background:#7A2833;filter:blur(60px);opacity:.45;animation:hs-drift 26s ease-in-out infinite"></div>
      <div style="position:absolute;top:170px;left:-140px;width:240px;height:240px;border-radius:50%;background:#B8963C;filter:blur(58px);opacity:.2;animation:hs-drift2 30s ease-in-out infinite"></div>
    </div>

    <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 14px 'Hind',sans-serif;color:rgba(255,255,255,.9);letter-spacing:.2px;z-index:3">
      <span>9:41</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="display:block;width:17px;height:11px;border-radius:2px;background:rgba(255,255,255,.9)"></span>
        <span style="display:block;width:15px;height:11px;border-radius:2px;background:rgba(255,255,255,.55)"></span>
        <span style="display:block;width:24px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);position:relative"><span style="position:absolute;top:2px;left:2px;bottom:2px;width:14px;border-radius:1.5px;background:rgba(255,255,255,.9)"></span></span>
      </div>
    </div>

    <div style="position:relative;z-index:2;height:100%;box-sizing:border-box;padding:54px 26px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center">

      <div style="width:100%;border-radius:34px;padding:38px 24px 26px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,0.05);backdrop-filter:blur(23px) saturate(180%);-webkit-backdrop-filter:blur(23px) saturate(180%);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.04)">
        <div style="position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);pointer-events:none"></div>

        <div style="display:flex;align-items:center;justify-content:center;width:172px;height:172px">
          <x-import component-from-global-scope="hisaab-seal" from="./assets/hisaab-seal.js" size="158" label="" state="{{ sealState }}" hint-size="172px,172px" style="display:block"></x-import>
        </div>

        <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:30px;height:132px;display:flex;align-items:flex-start;justify-content:center;font:300 14px 'Hind',sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.34)">Sealing your ledger</div>
        </sc-if>

        <sc-if value="{{ settled }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;width:100%">
            <div style="margin-top:24px;font-family:'Rozha One',serif;font-size:42px;line-height:1.05;color:#F4EDE4;letter-spacing:.4px;animation:hs-rise 620ms 520ms cubic-bezier(.2,.9,.25,1) both;text-shadow:0 2px 24px rgba(184,150,60,.2)">You're all set</div>

            <div style="margin-top:10px;max-width:262px;text-align:center;text-wrap:pretty;font:300 15px/1.45 'Hind',sans-serif;color:rgba(255,255,255,.5);animation:hs-rise 620ms 640ms cubic-bezier(.2,.9,.25,1) both">Your account is open and the maths is now our problem.</div>

            <button type="button" onClick="{{ onGo }}" style="margin-top:26px;position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:54px;box-sizing:border-box;border:1px solid rgba(184,150,60,.55);border-radius:27px;background:rgba(184,150,60,.16);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 6px 22px rgba(184,150,60,.16);cursor:pointer;animation:hs-rise 620ms 760ms cubic-bezier(.2,.9,.25,1) both;transition:transform .16s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease" style-hover="background:rgba(184,150,60,.24);border-color:rgba(184,150,60,.8)" style-active="transform:scale(.982);background:rgba(184,150,60,.32);border-color:#B8963C;box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 3px rgba(184,150,60,.16)">
              <span style="font:600 16px 'Hind',sans-serif;color:#F6E9CB;letter-spacing:.3px">Go to your hisaab-kitaab</span>
            </button>
          </div>
        </sc-if>
      </div>

      <button type="button" onClick="{{ onReplay }}" style="position:absolute;bottom:44px;padding:8px 14px;border:none;border-radius:14px;background:none;cursor:pointer;font:400 10.5px 'Hind',sans-serif;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.22);transition:color .18s ease" style-hover="color:rgba(184,150,60,.8)">Replay the stamp</button>

      <div style="position:absolute;bottom:14px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></div>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:26px;right:26px;top:110px;z-index:5;padding:13px 16px;border-radius:16px;text-align:center;font:400 13.5px 'Hind',sans-serif;color:#F4EDE4;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(184,150,60,.35);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:hs-rise 320ms ease both">{{ toast }}</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;animate&quot;,&quot;loading&quot;,&quot;settled&quot;],&quot;default&quot;:&quot;animate&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;}}">
class Component extends DCLogic {
  state = { phase: null, toast: null };

  componentDidMount() { this.run(); }
  componentWillUnmount() { clearTimeout(this._p); clearTimeout(this._t); }

  run() {
    clearTimeout(this._p);
    this.setState({ phase: "loading" });
    this._p = setTimeout(function () { this.setState({ phase: "settled" }); }.bind(this), 1500);
  }

  ping(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(function () { this.setState({ toast: null }); }.bind(this), 2400);
  }

  renderVals() {
    var self = this;
    var forced = this.props.phase;
    var phase = forced && forced !== "animate" ? forced : (this.state.phase || "loading");
    return {
      loading: phase === "loading",
      sealState: phase === "settled" ? "settled" : "loading",
      settled: phase === "settled",
      toast: this.state.toast,
      onGo: function () { self.ping("Opening your hisaab-kitaab — demo only."); },
      onReplay: function () { self.run(); }
    };
  }
}

</script>
</body>
</html>
